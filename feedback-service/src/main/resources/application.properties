spring.application.name=feedback-service
server.port=${PORT:8080}
spring.jackson.deserialization.accept-float-as-int=false

# The Lambda adapter replaces the embedded web server whenever it is on the classpath. Outside Lambda
# it is excluded so the app runs on Tomcat; the lambda profile re-enables it.
spring.autoconfigure.exclude=org.springframework.cloud.function.serverless.web.ServerlessAutoConfiguration

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55433/feedbacks}
spring.datasource.username=${DB_USER:feedback_service}
spring.datasource.password=${DB_PASSWORD:feedback_service}

# Hibernate creates the feedbacks table from FeedbackEntity when it is missing.
# "update" never drops or alters existing columns, so stored feedback is kept across restarts.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Ratings up to critical-max are CRITICAL, up to medium-max are MEDIUM, the rest LOW.
feedback.urgency.critical-max=${URGENCY_CRITICAL_MAX:3}
feedback.urgency.medium-max=${URGENCY_MEDIUM_MAX:6}

feedback.notifications.url=${NOTIFICATIONS_URL:http://localhost:8081}
feedback.notifications.connect-timeout=2s
feedback.notifications.read-timeout=${NOTIFICATIONS_READ_TIMEOUT:5s}
feedback.notifications.iam-region=${NOTIFICATIONS_IAM_REGION:}
