# Active only in AWS Lambda (FeedbackServiceHandler). DB_URL, DB_USER, DB_PASSWORD and NOTIFICATIONS_URL
# are required there; the handler checks them before Spring starts.

# Requests arrive through the serverless container instead of Tomcat (excluded in application.properties).
spring.autoconfigure.exclude=

# A Lambda instance handles one request at a time, so one database connection is enough.
# Keeping the pool small also avoids exhausting RDS connections when Lambda scales out.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1

# Logs go to stdout, which Lambda sends to CloudWatch Logs.
spring.main.banner-mode=off
# The serverless container registers Jackson Afterburner, which warns (harmlessly) for each record it
# cannot optimize, such as the notification payload.
logging.level.tools.jackson.module.afterburner=ERROR
