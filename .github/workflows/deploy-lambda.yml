name: Deploy dos três serviços na AWS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fiap-tc4-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Testar e empacotar os três serviços
        run: bash mvnw --batch-mode verify

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Conectar à AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Publicar a stack com AWS SAM
        working-directory: infra
        env:
          REPORT_SENDER_EMAIL: ${{ secrets.REPORT_SENDER_EMAIL }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
          NEON_DB_USER: ${{ secrets.NEON_DB_USER }}
          NEON_DB_PASSWORD: ${{ secrets.NEON_DB_PASSWORD }}
          AWS_CFN_EXECUTION_ROLE_ARN: ${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}
          AWS_SAM_ARTIFACT_BUCKET: ${{ vars.AWS_SAM_ARTIFACT_BUCKET }}
        run: |
          : "${REPORT_SENDER_EMAIL:?Cadastre o secret REPORT_SENDER_EMAIL}"
          : "${ADMIN_EMAILS:?Cadastre o secret ADMIN_EMAILS}"
          : "${NEON_DB_URL:?Cadastre o secret NEON_DB_URL}"
          : "${NEON_DB_USER:?Cadastre o secret NEON_DB_USER}"
          : "${NEON_DB_PASSWORD:?Cadastre o secret NEON_DB_PASSWORD}"
          : "${AWS_CFN_EXECUTION_ROLE_ARN:?Cadastre a variável AWS_CFN_EXECUTION_ROLE_ARN}"
          : "${AWS_SAM_ARTIFACT_BUCKET:?Cadastre a variável AWS_SAM_ARTIFACT_BUCKET}"

          sam deploy \
            --config-env github \
            --region "$AWS_REGION" \
            --s3-bucket "$AWS_SAM_ARTIFACT_BUCKET" \
            --s3-prefix fiap-tc4-dev \
            --role-arn "$AWS_CFN_EXECUTION_ROLE_ARN" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment=dev \
              EnableGitHubOidc=false \
              "DeploymentRevision=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              "NeonDbUrl=$NEON_DB_URL" \
              "NeonDbUser=$NEON_DB_USER" \
              "NeonDbPassword=$NEON_DB_PASSWORD" \
              "ReportSenderEmail=$REPORT_SENDER_EMAIL" \
              "AdminEmails=$ADMIN_EMAILS"
