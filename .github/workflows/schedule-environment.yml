name: Ligar e pausar ambiente AWS

on:
  schedule:
    - cron: '0 8 * * 1-5'
      timezone: America/Sao_Paulo
    - cron: '0 18 * * 1-5'
      timezone: America/Sao_Paulo
    - cron: '25 18 * * *'
      timezone: America/Sao_Paulo
  workflow_dispatch:
    inputs:
      state:
        description: Estado desejado do ambiente
        required: true
        type: choice
        options:
          - 'on'
          - 'off'

permissions:
  contents: read

concurrency:
  group: deploy-fiap-tc4-dev
  cancel-in-progress: false

jobs:
  change-state:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.AWS_ENVIRONMENT_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Conectar à AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Ajustar o estado do ambiente
        env:
          REQUESTED_STATE: ${{ inputs.state }}
          AWS_CFN_EXECUTION_ROLE_ARN: ${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}
        run: |
          if [[ -z "$REQUESTED_STATE" ]]; then
            # Recalcula o estado se o GitHub iniciar a execução com atraso.
            read -r weekday hour < <(TZ=America/Sao_Paulo date '+%u %-H')
            REQUESTED_STATE=off
            if (( weekday <= 5 && hour >= 8 && hour < 18 )); then
              REQUESTED_STATE=on
            fi
          fi
          bash infra/set-environment-state.sh "$REQUESTED_STATE"
